<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DuckDNS Test Page</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 600px;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        margin: 0.5rem 0;
        color: #ccc;
      }
      code {
        background: rgba(255,255,255,0.08);
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DuckDNS Test Page</h1>
      <p>This page is served through Traefik and your DuckDNS hostname.</p>
      <p>If you can see this, DNS and HTTPS routing are working.</p>
      <p>Visit <code>https://<span id="host">yourhost.duckdns.org</span>/test</code></p>
    </div>
    <script>
      document.getElementById('host').textContent = window.location.hostname;
    </script>
  </body>
</html>
