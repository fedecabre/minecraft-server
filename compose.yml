services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      TYPE: "PAPER"
      MEMORY: "4G"
      REPLACE_ENV_DURING_SYNC: "true"
      ONLINE_MODE: "TRUE"
      SERVER_NAME: "${MCADMIN_SERVER_NAME}"
      ENABLE_GEYSER: "true"
      ENABLE_FLOODGATE: "true"
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    volumes:
      - ./minecraft-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
